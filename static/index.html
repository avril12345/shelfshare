<!doctype html><html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ShelfShare</title><meta name="theme-color" content="#0b0f0b">
<link rel="stylesheet" href="/static/style.css">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
</head><body>
<header><h1>&gt; SHELFSHARE<span class="cur">_</span></h1><div id="who"></div></header>

<section id="auth" class="card hidden">
  <p class="dim">Share your bookshelves with friends. Borrow instead of buy.</p>
  <input id="u" placeholder="username" autocomplete="username" autocapitalize="off">
  <input id="p" type="password" placeholder="password (6+ chars)" autocomplete="current-password">
  <input id="inv" placeholder="invite code (needed to sign up)" autocapitalize="characters" autocomplete="off">
  <div class="row"><button id="loginBtn">LOG IN</button><button id="signupBtn" class="ghost">SIGN UP</button></div>
  <p id="authMsg" class="err"></p>
</section>

<main id="app" class="hidden">
  <nav><button data-tab="search" class="on">SEARCH</button><button data-tab="add">ADD</button><button data-tab="mine">MY BOOKS</button><button data-tab="reqs">REQUESTS</button><button data-tab="invites">INVITE</button></nav>

  <section id="tab-search" class="tab">
    <input id="q" type="search" placeholder="search title or author..." autocomplete="off">
    <div id="results"></div>
  </section>

  <section id="tab-add" class="tab hidden">
    <div class="card">
      <h2>SCAN BARCODE</h2>
      <div id="reader"></div><video id="vid" playsinline muted class="hidden"></video>
      <div class="row"><button id="scanBtn">START CAMERA</button><button id="stopBtn" class="ghost hidden">STOP</button></div>
      <div class="row"><input id="isbnIn" inputmode="numeric" placeholder="or type ISBN"><button id="lookupBtn">LOOK UP</button></div>
      <p id="scanMsg" class="dim"></p>
    </div>
    <form id="bookForm" class="card">
      <h2>BOOK DETAILS</h2>
      <img id="coverPrev" class="cover hidden" alt="">
      <input name="title" placeholder="title *" required>
      <input name="author" placeholder="author">
      <input name="isbn" placeholder="ISBN">
      <input name="location" list="locs" placeholder="location, e.g. Living Room">
      <datalist id="locs"></datalist><input type="hidden" name="cover_url"><input type="hidden" name="source" value="manual">
      <button>SAVE TO MY SHELF</button><p id="saveMsg" class="ok"></p>
    </form>
    <div class="card dim small"><h2>SHELF PHOTO SCAN</h2>Coming soon: snap a whole shelf and confirm the titles. <button id="shelfBtn" class="ghost" disabled>NOT YET</button></div>
  </section>

  <section id="tab-mine" class="tab hidden"><div id="mine"></div></section>
  <section id="tab-reqs" class="tab hidden"><div id="reqs"></div></section>
  <section id="tab-invites" class="tab hidden"><div class="card"><h2>INVITE FRIENDS</h2>
    <p class="dim small">ShelfShare is invite-only. Each code works once. Send a friend the link and the code fills itself in.</p>
    <button id="newInv">GENERATE CODE</button><p id="invMsg" class="err"></p></div><div id="invites"></div></section>
</main>
<script src="/static/app.js"></script>
</body></html>
