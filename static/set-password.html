<!doctype html><html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Set your password · ShelfShare</title><meta name="theme-color" content="#1f3a2c">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Special+Elite&display=swap">
<link rel="stylesheet" href="/static/style.css">
<style>.sp{max-width:420px;margin:8vh auto;padding:2rem;background:#fbf6e9;border:1px solid #c9b48a;box-shadow:0 3px 12px rgba(60,40,10,.15);font-family:'EB Garamond',serif}
.sp h1{font-family:'Special Elite',monospace;font-weight:normal;margin-top:0}.sp label{display:block;margin:.8rem 0 .2rem}
.sp input{width:100%;box-sizing:border-box;padding:.5rem;font:inherit}.sp button{margin-top:1.2rem}.sp .err{color:#8b1e1e}</style>
</head><body><main class="sp">
<h1>ShelfShare · Library card</h1>
<form id="f"><p>Choose a new password for your library card.</p>
<label for="p1">New password</label><input id="p1" type="password" minlength="8" required autocomplete="new-password">
<label for="p2">Confirm password</label><input id="p2" type="password" minlength="8" required autocomplete="new-password">
<p class="err" id="e"></p><button type="submit">Set password</button></form>
<div id="ok" hidden><p>Password set — <a href="/">enter the library</a>.</p></div>
</main><script>
const tok=new URLSearchParams(location.search).get("token")||"",f=document.getElementById("f"),e=document.getElementById("e");
if(!tok)e.textContent="This link is missing its token.";
f.onsubmit=async ev=>{ev.preventDefault();const a=p1.value,b=p2.value;
if(a.length<8)return e.textContent="Password must be at least 8 characters.";
if(a!==b)return e.textContent="The passwords don't match.";
const r=await fetch("/api/set-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:tok,password:a})});
const j=await r.json().catch(()=>({}));if(!r.ok)return e.textContent=j.error||"Something went wrong.";
f.hidden=true;document.getElementById("ok").hidden=false;};
</script></body></html>
